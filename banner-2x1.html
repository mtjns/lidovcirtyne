<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banner 2:1 — Lidovci Rtyně</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#FFFA4B;
    --gold:#FFDC04;
    --blue:#034187;
    --blue-dark:#023671;
    --ink:#252525;
    --white:#fff;
    --font:"Open Sans",Arial,Helvetica,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#ddd;font-family:var(--font);}
  img{display:block;max-width:100%;}

  /* Exact 2:1 export frame */
  .banner{
    position:relative;
    width:1400px;
    height:700px;
    overflow:hidden;
    background:var(--blue);
    color:#fff;
  }

  /* ---- photo ---- */
  .banner__photo{
    position:absolute;inset:0;
    background-image:url("assets/img/0.jpg");
    background-size:cover;
    background-position:50% 90%;
  }
  /* readability gradients: darken top (for logo) + strong blue foot */
  .banner__scrim{
    position:absolute;inset:0;
    background:
      linear-gradient(180deg, rgba(2,20,45,.55) 0%, rgba(2,20,45,0) 24%),
      linear-gradient(0deg, rgba(3,65,135,.10) 40%, rgba(3,65,135,0) 60%);
  }

  /* ---- logo top-left ---- */
  .banner__logo{
    position:absolute;top:40px;left:52px;z-index:3;
    width:300px;height:auto;
  }
  .banner__logo svg{width:100%;height:auto;display:block;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.35));}

  /* ---- bottom blue band ---- */
  .band{
    position:absolute;left:0;right:0;bottom:0;z-index:4;
    height:300px;
    background:var(--blue);
    border-top:9px solid var(--yellow);
    display:flex;align-items:stretch;
  }
  .band__left{
    width:47%;
    padding:40px 44px 40px 52px;
    display:flex;flex-direction:column;justify-content:center;
    border-right:1px solid rgba(255,255,255,.16);
  }
  .band__right{
    width:53%;
    padding:40px 52px 40px 46px;
    display:flex;flex-direction:column;justify-content:center;
  }

  .eyebrow{
    font-size:15px;font-weight:700;text-transform:uppercase;
    letter-spacing:.16em;color:var(--yellow);margin-bottom:16px;
  }
  .headline{
    font-weight:800;text-transform:uppercase;line-height:.98;
    letter-spacing:-.02em;font-size:58px;
  }
  .headline .hl{color:var(--yellow);}
  .band__web{
    margin-top:22px;font-weight:700;text-transform:lowercase;
    letter-spacing:.02em;font-size:22px;color:#fff;display:inline-flex;align-items:center;gap:12px;
  }
  .band__web::before{content:"";width:34px;height:6px;background:var(--yellow);display:inline-block;}

  /* ---- three points ---- */
  .points{display:flex;gap:34px;align-items:flex-start;}
  .point{flex:1;display:flex;flex-direction:column;gap:18px;}
  .point__rule{display:block;width:56px;height:8px;background:var(--yellow);}
  .point__txt{
    font-weight:700;text-transform:uppercase;line-height:1.12;
    letter-spacing:.005em;font-size:21px;color:#fff;
  }
</style>
</head>

<div class="banner">
  <div class="banner__photo"></div>
  <div class="banner__scrim"></div>

  <!-- bottom blue band -->
  <div class="band">
    <div class="band__left">
      <p class="eyebrow">KDU-ČSL · Rtyně v Podkrkonoší</p>
      <h1 class="headline">Tvořte s námi<br><span class="hl">budoucnost</span></h1>
      <span class="band__web">lidovcirtyne.cz</span>
    </div>
    <div class="band__right">
      <div class="points">
        <div class="point">
          <span class="point__rule"></span>
          <span class="point__txt">Příprava nových lokalit pro výstavbu</span>
        </div>
        <div class="point">
          <span class="point__rule"></span>
          <span class="point__txt">Podpora komunity</span>
        </div>
        <div class="point">
          <span class="point__rule"></span>
          <span class="point__txt">Nové zdroje pitné vody</span>
        </div>
      </div>
    </div>
  </div>
</div>
