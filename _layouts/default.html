<!doctype html>
<html lang="{{ site.lang | default: 'cs' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ '/assets/logo/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/logo/favicon.png' | relative_url }}">

  <!-- Open Graph / social preview -->
  {% assign page_title = site.title %}{% if page.title and page.url != '/' %}{% assign page_title = page.title | append: ' — ' | append: site.title %}{% endif %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/logo/og-image.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="cs_CZ">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page_title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ '/assets/logo/og-image.png' | absolute_url }}">

  <!-- Structured data (JSON-LD) — driven from _config.yml `org` -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": {{ '/#organization' | absolute_url | jsonify }},
        "name": {{ site.org.name | jsonify }},
        "url": {{ '/' | absolute_url | jsonify }},
        "logo": {{ '/assets/logo/Lidovci_logo_RGB_black-KDU.png' | absolute_url | jsonify }},
        "image": {{ '/assets/logo/og-image.png' | absolute_url | jsonify }},
        {% if site.org.email != "" %}"email": {{ site.org.email | jsonify }},{% endif %}
        {% if site.org.phone != "" %}"telephone": {{ site.org.phone | jsonify }},{% endif %}
        {% if site.org.facebook != "" %}"sameAs": [ {{ site.org.facebook | jsonify }} ],{% endif %}
        "areaServed": {{ site.org.address | append: ", " | append: site.org.district | append: ", " | append: site.org.region | jsonify }},
        "address": {
          "@type": "PostalAddress",
          "addressLocality": {{ site.org.address | jsonify }},
          "addressRegion": {{ site.org.region | jsonify }},
          "addressCountry": "CZ"
        },
        "parentOrganization": {
          "@type": "Organization",
          "name": "KDU-ČSL",
          "url": {{ site.org.national_url | jsonify }}
        }
      },
      {
        "@type": "WebSite",
        "@id": {{ '/#website' | absolute_url | jsonify }},
        "url": {{ '/' | absolute_url | jsonify }},
        "name": {{ site.title | jsonify }},
        "inLanguage": "cs",
        "publisher": { "@id": {{ '/#organization' | absolute_url | jsonify }} }
      }
    ]
  }
  </script>

  <!-- Body & nav font: Open Sans (free / open source) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Compiled Tailwind CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <!-- Hand-written overrides (loaded after Tailwind) -->
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

  {% seo %}
</head>
<body class="min-h-screen flex flex-col">
  {% include header.html %}

  <main class="flex-1">
    {{ content }}
  </main>

  {% include footer.html %}
</body>
</html>
